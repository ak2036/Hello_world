<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hero Quest">
<title>Ankitha's Hero Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e; --card:#151518; --card-2:#1b1b1f; --line:#26262b; --line-2:#323238;
  --ink:#f2f2f4; --muted:#8c8c95; --dim:#5d5d66;
  --red:#e23636; --red-2:#ff4d4d; --gold:#e8b23a; --gold-2:#f3c75a;
  --blue:#5b8def; --blue-2:#3d6fd8; --purple:#9b7bf0; --green:#3fb978;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:92px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.fred{font-family:inherit;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.sparkles{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* header */
header{padding:22px 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{margin:0;font-size:1.25rem;font-weight:700;line-height:1.2}
.title small{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-top:2px;letter-spacing:0}
.hdr-btns{display:flex;gap:6px;flex:none}
.gear{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);font-size:1rem;flex:none;filter:grayscale(1);opacity:.85}
.gear:hover{opacity:1}
.levelcard{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.lvrow{display:flex;align-items:center;gap:12px}
.lvbadge{width:44px;height:44px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:1.05rem;flex:none;text-align:center;line-height:1}
.lvbadge small{display:block;font-size:.58rem;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.lvrow > .av{margin-left:-2px}
.lvname{font-weight:650;font-size:.98rem}
.xpbar{height:4px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .8s ease}
.xptext{font-size:.75rem;color:var(--muted);margin-top:6px}

/* cards & basics */
main{position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h2{margin:0 0 12px;font-size:1rem;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .sub{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.stat b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{background:var(--red);color:#fff;font-weight:600;padding:11px 16px;border-radius:12px;transition:opacity .15s,transform .1s;font-size:.92rem}
.btn:active{transform:scale(.97)}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.lav{background:var(--card-2);color:var(--ink);border:1px solid var(--line-2)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);font-weight:500;font-size:.84rem;margin:3px;transition:all .15s;color:var(--ink)}
.chip.on{background:var(--ink);color:#111;border-color:var(--ink)}
.disc{font-size:.74rem;color:var(--dim);text-align:center;margin:12px 0 0}

/* avatars & mentors */
.av{display:inline-block;border-radius:50%;overflow:hidden;border:1px solid var(--line-2);flex:none;line-height:0;background:#000;vertical-align:middle}
.av svg,.av img{display:block;width:100%;height:100%;object-fit:cover}
.av.locked{opacity:.35}
.av.locked svg,.av.locked img{filter:grayscale(1)}
.pet{display:flex;gap:12px;align-items:center}
.pet .face{padding:0;border-radius:50%;flex:none}
.pet .face.zap{animation:zap .35s}
@keyframes zap{50%{transform:scale(1.06)}}
.who{font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 3px;letter-spacing:.02em}
.bubble{font-size:.92rem;color:var(--ink)}
.mentor{padding:14px}
.boss .av{border-color:#3a2d55}
.hp{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.hp i{display:block;height:100%;background:var(--purple);transition:width .8s}
.reportcard{border-color:#3b3220}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;text-align:center}
.roster b{display:block;font-size:.72rem;font-weight:600;margin-top:6px;line-height:1.2}
.roster span{display:block;font-size:.64rem;color:var(--muted)}
.roster .locked b{color:var(--dim)}

/* missions */
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.quest.done .txt b{color:var(--muted)}
.quest .ico{font-size:1.15rem;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--card-2);flex:none}
.quest .txt{flex:1;min-width:0}
.quest .txt b{display:block;font-weight:600;font-size:.93rem}
.quest .txt span{font-size:.78rem;color:var(--muted)}
.quest .xp{font-size:.68rem;font-weight:600;color:var(--gold);margin-left:6px;white-space:nowrap}
.check{width:24px;height:24px;border-radius:50%;background:var(--green);color:#0c0c0e;display:grid;place-items:center;font-weight:800;font-size:.75rem;flex:none}
.perfect{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.perfect i{display:block;height:100%;background:var(--red);transition:width .6s}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigchoice button{padding:12px 8px;border-radius:12px;font-weight:600;font-size:.88rem;border:1px solid var(--line-2);transition:all .15s}
.bigchoice button .e{display:block;font-size:1.3rem;margin-bottom:2px}
.bigchoice button.on{border-color:var(--ink);background:var(--card-2)}

/* cycle */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg);width:120px;height:120px}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:2rem;font-weight:700;display:block;line-height:1;letter-spacing:-.03em}
.ring .mid span{font-size:.68rem;color:var(--muted);font-weight:500}
.phase{font-weight:650;font-size:1.02rem}
.tip{border-top:1px solid var(--line);padding-top:12px;font-size:.86rem;color:var(--muted);margin-top:14px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:.95rem;font-weight:650}
.calhead button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.68rem;color:var(--dim);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.82rem;font-weight:500;position:relative;color:var(--ink)}
.cal .d.empty{visibility:hidden}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .d.future{color:var(--muted)}
.cal .d.period{background:var(--red);color:#fff}
.cal .d.spot{background:rgba(226,54,54,.25)}
.cal .d.pred{box-shadow:inset 0 0 0 1.5px rgba(226,54,54,.6);color:#ff9a9a}
.cal .d.fert{background:rgba(155,123,240,.16)}
.cal .d.ovu{background:rgba(155,123,240,.4)}
.cal .d.free{background:rgba(63,185,120,.22);color:#9fe5be}
.cal .d.slip{background:rgba(232,178,58,.18);color:var(--gold-2)}
.cal .d .em{display:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* sugar */
.flame{font-size:1.6rem;text-align:center;line-height:1}
.jar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.jar i{aspect-ratio:1;border-radius:6px;background:var(--line);font-style:normal;font-size:0}
.jar i.on{background:var(--green)}

/* sleep */
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:16px;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2);font-size:.65rem;color:var(--muted)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{width:100%;max-width:28px;border-radius:6px;background:var(--blue);transition:height .6s}
.bar i.low{background:var(--line-2)}
.bar span{font-size:.65rem;color:var(--muted)}
.bar b{font-size:.68rem;font-weight:500;color:var(--muted)}
.hearts button{font-size:1.5rem;padding:2px;filter:grayscale(1);opacity:.3;transition:all .15s}
.hearts button.on{filter:none;opacity:1}
.listrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.listrow b.fred{font-size:.92rem;font-weight:600}
.x{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);color:var(--muted);flex:none}

/* movies */
.field{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);outline:none;color-scheme:dark}
.field:focus{border-color:var(--muted)}
.field::placeholder{color:var(--dim)}
textarea.field{resize:vertical}
.movie{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.movie:last-child{border-bottom:0}
.movie .poster{width:38px;height:50px;border-radius:8px;display:grid;place-items:center;font-size:1.2rem;flex:none;background:var(--card-2)}
.movie .info{flex:1;min-width:0}
.movie .info b{display:block;font-weight:600;font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.movie .info span{font-size:.76rem;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;padding:7px;border-radius:9px;font-weight:500;color:var(--muted);font-size:.85rem}
.seg button.on{background:var(--card-2);color:var(--ink)}
.spin{font-size:1.3rem;font-weight:650;text-align:center;padding:26px 10px;border-radius:14px;border:1px solid var(--line);min-height:90px;display:grid;place-items:center}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:14px 6px;border-radius:14px;border:1px solid var(--line)}
.badge .e{font-size:1.6rem;display:block}
.badge b{display:block;font-weight:600;font-size:.78rem;margin-top:6px}
.badge span{font-size:.66rem;color:var(--muted);display:block;margin-top:2px}
.badge.locked .e{filter:grayscale(1);opacity:.25}
.badge.locked b{color:var(--dim)}
.badge.got{border-color:var(--line-2);background:var(--card-2)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(12,12,14,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-width:52px;font-size:.66rem;font-weight:500;color:var(--dim);transition:color .15s}
nav button .e{font-size:1.15rem;filter:grayscale(1);opacity:.55;transition:all .15s}
nav button.on{color:var(--ink)}
nav button.on .e{filter:none;opacity:1}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:1.1rem}
.sheet label{display:block;font-weight:500;font-size:.78rem;margin:14px 0 6px;color:var(--muted)}
.sheet label.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.levelup{text-align:center;padding:6px 0}
.levelup .e{margin:10px 0}
.levelup h3{font-size:1.3rem;margin:6px 0}
.levelup .bubble{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.levelup .tc-sub{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* toasts & confetti */
.toasts{position:fixed;top:14px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--card-2);color:var(--ink);border:1px solid var(--line-2);padding:9px 14px;border-radius:12px;font-size:.86rem;font-weight:500;animation:pop .25s ease-out,fade .35s 2.4s forwards}
.toast.hero{display:flex;align-items:center;gap:10px;max-width:520px;line-height:1.35}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
@keyframes fade{to{opacity:0;transform:translateY(-8px)}}
.confetti{position:fixed;top:-30px;z-index:45;pointer-events:none;font-size:1rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* reminders */
.notif-status{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.88rem}
.notif-status .btn{margin-top:10px}
.rem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);transition:opacity .2s}
.rem.off{opacity:.45}
.rem-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:0}
.rem-main > div{min-width:0}
.rem-main b{display:block;font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-main span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-time{width:108px;padding:6px;font-size:.82rem;flex:none}
.switch{position:relative;width:40px;height:24px;flex:none;margin:0!important;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i:after{transform:translateX(16px)}
.adv{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px}
.adv summary{font-weight:500;cursor:pointer;font-size:.88rem}
.heropick{display:flex;flex-wrap:wrap;gap:6px}
.heropick button{border-radius:50%;padding:0;opacity:.35;transition:opacity .15s}
.heropick button.on{opacity:1}
.portraits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;text-align:center}
.portraits button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.68rem;color:var(--muted)}
.portraits .set{color:var(--green)}

/* story mode */
.story{position:fixed;inset:0;z-index:60;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;user-select:none;background:#000;animation:fadein .5s}
.story.out{animation:fadeout .4s forwards}
@keyframes fadein{from{opacity:0}} @keyframes fadeout{to{opacity:0}}
.story .bars-top,.story .bars-bot{display:none}
.story .ctrl{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;z-index:2;display:flex;gap:8px}
.story .ctrl button{color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:500}
.story .stage{width:100%;max-width:480px;padding:0 24px}
.story .panel{text-align:center;animation:panelin .5s ease-out}
@keyframes panelin{from{opacity:0;transform:translateY(8px)}}
.story .caption{margin-top:22px;font-size:1.08rem;line-height:1.55;font-weight:400;color:rgba(255,255,255,.92);min-height:110px}
.story .narr{font-style:italic;color:rgba(255,255,255,.7)}
.story .who{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:16px}
.story .bigav .av{border-color:rgba(255,255,255,.15)}
.story .bigav.speaking .av{animation:talk .9s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.025)}}
.story .bigav.villain .av{border-color:#3a2d55}
.story .globe{font-size:5rem;opacity:.9}
.story .team{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.story .team small{display:block;font-size:.66rem;color:rgba(255,255,255,.55);margin-top:6px}
.story .tap{margin-top:22px;font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase}
.titlecard .tc-name{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.titlecard .tc-logo{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:12px 0;animation:titlein 1.4s ease-out}
.titlecard .tc-logo span{color:var(--red)}
@keyframes titlein{from{opacity:0;letter-spacing:.2em}}
.titlecard .tc-sub{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.tc-flash{display:none}
</style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="wrap">
  <header>
    <div class="top">
      <h1 class="title" id="appTitle">Hero Quest ⚡<small id="greet"></small></h1>
      <div class="hdr-btns"><button class="gear" data-act="alerts" aria-label="Reminders">🔔</button><button class="gear" data-act="settings" aria-label="Settings">⚙️</button></div>
    </div>
    <div class="levelcard" id="levelcard"></div>
  </header>
  <main id="main"></main>
</div>

<nav><div class="in" id="nav"></div></nav>

<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="reminders-core.js"></script>
<script>
(() => {
'use strict';

/* ---------------- storage ---------------- */
const STORE = 'glowquest.v1'; // kept so existing data carries over
const DEFAULT_REMINDERS = () => {
  const all = [0,1,2,3,4,5,6];
  return [
    {id:'sugar',   type:'sugar',      on:true,  time:'20:30', days:all, hero:'hulk',    tab:'home',   skip:true, title:'Sugar Smash check-in', body:'HULK ASK: did {n} smash sugar today? Log it!'},
    {id:'sleepLog',type:'sleep',      on:true,  time:'09:00', days:all, hero:'cap',     tab:'home',   skip:true, title:'Recharge report',      body:'Morning, soldier. How did you sleep? Log it for +20 XP.'},
    {id:'cycle',   type:'cycle',      on:true,  time:'21:00', days:all, hero:'strange', tab:'home',   skip:true, title:'Status report',        body:'The Time Stone needs today\'s update. How are you feeling, {n}?'},
    {id:'bedtime', type:'custom',     on:true,  time:'22:30', days:all, hero:'cap',     tab:'sleep',  title:'Lights out soon',      body:'Phone down in 30 minutes, {n}. Shield up for tomorrow 🛡️'},

/* ---------------- date helpers ---------------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => key(new Date());
const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const dowShort = k => ['Su','Mo','Tu','We','Th','Fr','Sa'][parse(k).getDay()];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;

/* ---------------- derived: cycle ---------------- */
const BLEED = ['light','medium','heavy'];
function periods(){
  const days = Object.keys(S.period).filter(k => BLEED.includes(S.period[k].flow)).sort();
  const out = [];
  for(const d of days){
    const last = out[out.length-1];
    if(last && diffDays(last.end,d) <= 2){ last.end = d; }
    else out.push({start:d,end:d});
  }
  out.forEach(p => p.len = diffDays(p.start,p.end)+1);
  return out;
}
function cycleInfo(){
  const ps = periods(), t = today();
  const gaps = [];
  for(let i=1;i<ps.length;i++){ const g = diffDays(ps[i-1].start, ps[i].start); if(g>=15 && g<=60) gaps.push(g); }
  const avg = gaps.length ? Math.round(mean(gaps.slice(-6))) : S.settings.cycleLen;
  const plen = ps.length ? Math.max(2, Math.min(10, Math.round(mean(ps.slice(-6).map(p=>p.len))))) : 5;
  const ovulDay = avg - 14;
  if(!ps.length) return {avg, plen, ovulDay, none:true, ps, cycles:0};
  const last = ps[ps.length-1];
  const day = diffDays(last.start, t) + 1;
  const next = addDays(last.start, avg);
  const until = diffDays(t, next);
  let phase, emoji, tip;
  if(day <= last.len || day <= plen && diffDays(last.end,t) <= 1){ phase='Recovery Mode'; emoji='🛡️'; tip='Even Avengers rest between battles: hot water bottle, iron-rich snacks and extra sleep. You\'ve got this, Captain 💪'; }
  else if(day < ovulDay-5){ phase='Power Rising'; emoji='⚡'; tip='Power levels climbing! Great time for training, a new mission or a fun plan ⚡'; }
  else if(day === ovulDay){ phase='Ovulation Day'; emoji='🌟'; tip='Peak power day! Estimated ovulation — energy level: cosmic 🌟'; }
  else if(day <= ovulDay+1){ phase='Fertile Window'; emoji='💫'; tip='Estimated fertile window. Feeling strong and social? That\'s the hormones suiting up 💫'; }
  else if(day <= avg){ phase='Shields Charging'; emoji='🔋'; tip='Cravings incoming — dark chocolate & magnesium are your sidekicks. Be gentle with yourself, hero 🫶'; }
  else { phase='Incoming Alert'; emoji='🚨'; tip='Your period may arrive any day now. Pack the emergency kit & log it when it starts!'; }
  return {avg, plen, ovulDay, last, day, next, until, phase, emoji, tip, ps, cycles:ps.length};
}
function cycleMarks(ci){
  const pred = new Set(), fert = new Set(), ovu = new Set();
  if(ci.none) return {pred,fert,ovu};
  for(let k=0;k<=4;k++){
    const start = addDays(ci.last.start, ci.avg*k);
    if(k>0) for(let i=0;i<ci.plen;i++) pred.add(addDays(start,i));
    const ov = addDays(start, ci.ovulDay-1);
    ovu.add(ov);
    for(let i=-5;i<=1;i++) if(i!==0) fert.add(addDays(ov,i));
  }
  return {pred,fert,ovu};
}

/* ---------------- derived: streaks ---------------- */
function streakEndingToday(test){
  let d = today(), n = 0;
  if(!test(d)) d = addDays(d,-1); // today not logged yet doesn't break the streak
  while(test(d)){ n++; d = addDays(d,-1); }
  return n;
}
function bestStreak(keys, test){
  const ks = keys.filter(test).sort(); let best=0, cur=0, prev=null;
  for(const k of ks){ cur = (prev && diffDays(prev,k)===1) ? cur+1 : 1; best = Math.max(best,cur); prev = k; }
  return best;
}

const goodSleep = k => S.sleep[k] && sleepHours(S.sleep[k]) >= Math.min(7, S.settings.sleepGoal);
const checkedIn = k => !!(S.sugar[k] || S.sleep[k] || S.period[k]);
const perfectDay = k => !!(S.sugar[k] && S.sleep[k] && S.period[k]);

function stats(){
  const ci = cycleInfo();

  const allDays = new Set([...sugarKeys, ...sleepKeys, ...Object.keys(S.period)]);
  return {

}

function computeXP(s){

function pickVoice(id){
  const p = VOICE_PROFILES[id] || VOICE_PROFILES.narrator;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === 'en');
  if(!vs.length) return null;
  const gender = v => FEMALE_V.test(v.name) ? 'f' : MALE_V.test(v.name) ? 'm' : '?';
  const score = v => (gender(v) === p.g ? 4 : gender(v) === '?' ? 1 : 0) + (v.lang.replace('_','-').toLowerCase() === p.lang.toLowerCase() ? 2 : 0) + (v.localService ? .5 : 0);
  const ranked = vs.slice().sort((a,b) => score(b) - score(a));
  const top = ranked.filter(v => score(v) >= score(ranked[0]) - 1).slice(0,3);
  const idx = Object.keys(VOICE_PROFILES).filter(k => VOICE_PROFILES[k].g === p.g).indexOf(id);
  return top[Math.max(0, idx) % top.length];   // spread similar characters across the best few voices
}
const speechText = t => String(t).replace(/<[^>]+>/g,'').replace(/\p{Extended_Pictographic}|️/gu,'')
  .replace(/\b[A-Z]{2,}\b/g, w => w[0] + w.slice(1).toLowerCase()).replace(/\s+/g,' ').trim();
function speak(id, text, onend){
  if(!voiceOn()){ return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speechText(text)), p = VOICE_PROFILES[id] || VOICE_PROFILES.narrator, v = pickVoice(id);
  if(v){ u.voice = v; u.lang = v.lang; }
  u.pitch = p.pitch; u.rate = p.rate;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = u.onerror = () => { if(onend) onend(started); };
  speechSynthesis.speak(u);
  return true;
}

        <div class="who">Nick Fury</div><div class="caption" style="min-height:0">So, recruit — what do we call you?</div>
        <input class="field" id="codename" maxlength="24" value="${esc(S.settings.name)}" style="margin-top:8px;text-align:center;font-size:1.1rem;background:#111;border-color:#333;color:#fff">
        <button class="btn block" data-s="go" style="margin-top:12px">Avengers, assemble</button></div>`;
      typing = false; speak('fury', 'So, recruit. What do we call you?'); return;
    }
    const speaker = p.hero || 'narrator';
    const art = p.hero ? `<div class="bigav ${p.hero==='sugaros'?'villain':''}" id="bigav">${av(p.hero,132)}</div><div class="who">${HEROES[p.hero].n}${p.hero==='sugaros'?' — The Snack Titan':''}</div>`
              : p.team ? `<div class="team">${p.team.map(id=>`<div>${av(id,54)}<small>${HEROES[id].n}</small></div>`).join('')}</div>` : p.art;
    stage.innerHTML = `<div class="panel">${art}<div class="caption ${p.hero?'speech':'narr'}" id="cap"></div><div class="tap">Tap to continue</div></div>`;
    const line = p.text.replace(/\{n\}/g, S.settings.name);
    typeOut(stage.querySelector('#cap'), line);
    const ba = stage.querySelector('#bigav'); if(ba) ba.classList.add('speaking');
    const here = i;
    speak(speaker, line, started => {
      if(ba) ba.classList.remove('speaking');
      if(!started) return;
      // cinematic auto-advance once the line is both spoken and fully typed (unless she already tapped ahead)
      const advance = () => { if(!ov.isConnected || i !== here) return; if(typing) auto = setTimeout(advance, 250); else auto = setTimeout(() => { if(i === here) next(); }, 1300); };
      advance();
    });
  };
  const finish = (assemble) => {
    clearInterval(storyTimer); clearTimeout(auto); hush();
    const inp = ov.querySelector('#codename');
    if(inp && inp.value.trim()) S.settings.name = inp.value.trim().slice(0,24);
    S.meta.storySeen = true; save();
    if(assemble) speak('cap', 'Avengers... assemble!');
    ov.classList.add('out'); setTimeout(()=>ov.remove(), 450);
    render(); confetti(30); setTimeout(()=>toast('Chapter 1 begins. Good luck, Agent.'), 400);
  };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if(b && b.dataset.s === 'mute'){ S.settings.voice = !voiceOn(); save(); b.textContent = muteLabel(); if(!voiceOn()) hush(); return; }
    if(b){ finish(b.dataset.s === 'go'); return; }
    if(e.target.closest('input')) return;
    if(STORY[i].final) return;
    if(typing){ clearInterval(storyTimer); typing = false; stage.querySelector('#cap').textContent = full; return; }
    next();
  });
  show();
}

/* ---------------- effects ---------------- */
function toast(msg, cls=''){
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.innerHTML = msg;
  const life = cls === 'hero' ? 7000 : 3000;
  t.style.animationDelay = `0s, ${(life-600)/1000}s`;
  document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(), life);
}
function confetti(n=26){
  const COLORS = ['#e23636','#e8b23a','#f2f2f4'];
  for(let i=0;i<Math.ceil(n/2);i++){
    const c = document.createElement('div'); c.className='confetti'; c.textContent = '✦';
    c.style.left = Math.random()*100+'vw'; c.style.color = COLORS[i%3];
    c.style.animationDuration = (2+Math.random()*1.6)+'s'; c.style.animationDelay = (Math.random()*.4)+'s';
    c.style.fontSize = (.6+Math.random()*.6)+'rem';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4200);
  }
}
function celebrate(){
  const s = stats(), xp = computeXP(s), L = levelFor(xp);
  const got = BADGES.filter(b=>b.t(s)).map(b=>b.id);
  const first = S.meta.lastXP === null;
  if(!first){
    const gain = xp - S.meta.lastXP;
    if(gain > 0){ toast(`+${gain} XP ⚡`); confetti(gain>=40?30:12); }
    got.filter(id=>!S.meta.seenBadges.includes(id)).forEach(id=>{
      if(!S.meta.badgeDates[id]) S.meta.badgeDates[id] = today();
      const b = BADGES.find(x=>x.id===id); setTimeout(()=>toast(`${b.e} Badge unlocked: <b>${b.n}</b>!`), 500);
    });
    if(L > S.meta.lastLevel){
      for(let l = S.meta.lastLevel+1; l <= L; l++) if(!S.meta.levelDates[l]) S.meta.levelDates[l] = today();
      setTimeout(()=>{
        confetti(60);
        const h = heroForLevel(L), joined = L <= ROSTER.length;
        if(joined) speak(h, HEROES[h].join);
        openSheet(`<div class="levelup"><div class="tc-sub" style="color:var(--muted)">Chapter ${L}</div><div class="e">${av(h,120)}</div>
          <h3 class="fred">${joined ? HEROES[h].n+' joins your team!' : 'Level '+L+'!'}</h3>
          ${joined ? `<div class="bubble" style="margin:8px 0 12px">“${HEROES[h].join}”</div>` : ''}

/* ---------------- calendar ---------------- */
function calendar(month, cell, act){
  const [y,m] = month.split('-').map(Number);
  const first = new Date(y,m-1,1), days = new Date(y,m,0).getDate();
  let h = `<div class="calhead"><button data-act="${act}" data-dir="-1">‹</button><b class="fred">${MONTHS[m-1]} ${y}</b><button data-act="${act}" data-dir="1">›</button></div><div class="cal">`;
  h += ['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++) h += `<div class="d empty"></div>`;
  const t = today();
  for(let d=1; d<=days; d++){
    const k = `${y}-${pad(m)}-${pad(d)}`, c = cell(k);
    h += `<button class="d ${c.cls||''} ${k===t?'today':''} ${k>t?'future':''}" data-act="${c.act||''}" data-day="${k}">${d}${c.em?`<span class="em">${c.em}</span>`:''}</button>`;
  }
  return h + `</div>`;
}
const shiftMonth = (mo, dir) => { const [y,m] = mo.split('-').map(Number); const d = new Date(y, m-1+dir, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };

const RCACHE = 'hero-quest-v1';
const STATE_URL = new URL('__reminder-state', location.href).href;
const DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const REM_TYPES = {sugar:'Sugar check-in', sleep:'Sleep log', cycle:'Cycle check-in', periodSoon:'Period heads-up', report:'Monthly report', custom:'Custom'};
const TAB_NAMES = {home:'HQ', cycle:'Cycle', sugar:'Sugar', sleep:'Sleep', movies:'Movies', badges:'Badges'};
const canNotify = () => 'Notification' in window;
const hasSW = () => 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const daysLabel = d => { const s = [...d].sort().join(''); return s==='0123456'?'Every day':s==='12345'?'Weekdays':s==='06'?'Weekends':!d.length?'No days':d.slice().sort().map(i=>DAYNAMES[i]).join(', '); };

function reminderSnapshot(){
  const t = today(), recent = [addDays(t,-1), t, addDays(t,1)], ci = cycleInfo();
  return { enabled:S.notify.enabled, name:S.settings.name, reminders:S.notify.reminders, lastFired:S.notify.lastFired,
    done:{ sugar:recent.filter(k=>S.sugar[k]), sleep:recent.filter(k=>S.sleep[k]), cycle:recent.filter(k=>S.period[k]) },
    nextPeriod: ci.none ? null : ci.next, avgCycle: ci.avg };
}
async function readCachedState(){
  try{ if(!('caches' in window)) return null; const r = await (await caches.open(RCACHE)).match(STATE_URL); return r ? await r.json() : null; }catch(e){ return null; }
}
function mergeFired(c){ if(!c || !c.lastFired) return; for(const [id,k] of Object.entries(c.lastFired)) if(!S.notify.lastFired[id] || S.notify.lastFired[id] < k) S.notify.lastFired[id] = k; }
// The service worker can't read localStorage, so it gets a copy of the reminder settings via the Cache API.
async function syncReminderState(){
  try{
    if(!('caches' in window)) return;
    mergeFired(await readCachedState());
    await (await caches.open(RCACHE)).put(STATE_URL, new Response(JSON.stringify(reminderSnapshot()), {headers:{'content-type':'application/json'}}));
  }catch(e){}
}
async function showNote(n){
  const opts = { body:n.body, tag:`hq-${n.id}-${n.key||''}`, renotify:false, icon:`icons/hero-${n.hero}.png`, badge:'icons/badge-96.png', data:{tab:n.tab}, vibrate:[120,60,120] };
  let shown = false;
  if(canNotify() && Notification.permission === 'granted'){
    try{
      const reg = hasSW() ? await navigator.serviceWorker.getRegistration() : null;
      if(reg) await reg.showNotification(n.title, opts); else new Notification(n.title, opts);
      shown = true;
    }catch(e){}
  }
  if(!shown && document.visibilityState === 'visible') toast(`${av(n.hero,34)}<span><b>${esc(n.title)}</b><br>${esc(n.body)}</span>`, 'hero');
}
let checking = false;
async function checkReminders(){
  if(checking || !S.notify.enabled) return;
  checking = true;
  try{
    mergeFired(await readCachedState());
    const parts = HeroReminders.localParts(new Date());
    const list = HeroReminders.due(reminderSnapshot(), parts, 180);
    for(const n of list){ await showNote(n); S.notify.lastFired[n.id] = parts.key; }
    if(list.length){ save(); await syncReminderState(); }
  } finally { checking = false; }
}
// Mark reminders whose time already passed today as done, so turning alerts on doesn't fire a burst of old ones.
function seedFired(ids){
  const parts = HeroReminders.localParts(new Date());
  HeroReminders.due(reminderSnapshot(), parts, 24*60).forEach(n => { if(!ids || ids.includes(n.id)) S.notify.lastFired[n.id] = parts.key; });
}
async function registerPeriodic(){
  try{
    if(!hasSW()) return;
    const reg = await navigator.serviceWorker.ready;
    if(!('periodicSync' in reg)) return;
    const st = await navigator.permissions.query({name:'periodic-background-sync'});
    if(st.state === 'granted') await reg.periodicSync.register('hero-reminders', {minInterval: 15*60*1000});
  }catch(e){}
}
async function enableNotifications(){
  if(!canNotify()){ toast('This browser can\'t show notifications 😕'); return; }
  const p = await Notification.requestPermission();
  if(p !== 'granted'){ toast('Notifications were not allowed'); remindersSheet(); return; }
  S.notify.enabled = true; seedFired(); save(); await syncReminderState(); registerPeriodic();
  remindersSheet(); toast('Mission alerts online ⚡');
  showNote({id:'welcome', key:today(), hero:'fury', tab:'home', title:'Nick Fury · Alerts online', body:`Agent ${S.settings.name}, HQ can now reach you. Stay sharp.`});
}
function notifStatus(){
  if(location.protocol === 'file:') return {msg:'📍 Open Hero Quest from its web address (e.g. GitHub Pages) to get phone notifications. Until then, reminders pop up inside the app while it\'s open.', enableInApp:true};
  if(isIOS && !standalone()) return {msg:'📱 On iPhone: tap <b>Share → Add to Home Screen</b>, then open Hero Quest from the home screen and come back here to turn on notifications.', enableInApp:true};
  if(!canNotify()) return {msg:'This browser doesn\'t support notifications. Reminders will pop up inside the app while it\'s open.', enableInApp:true};
  if(Notification.permission === 'denied') return {msg:'🚫 Notifications are blocked. Allow them for this site in your browser settings, then come back.'};
  if(Notification.permission !== 'granted' || !S.notify.enabled) return {msg:'Let your Avengers ping you when it\'s mission time.', btn:true};
  return {msg:'✅ Mission alerts are <b>ON</b>', on:true};
}

const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function makePushConfig(){
  const key = (sheet.querySelector('#vapid').value || '').trim();
  S.notify.vapid = key; save();
  if(!hasSW() || !('PushManager' in window)){ toast('Push needs the app opened from its web address (and on iPhone, from the home screen)'); return; }
  if(!key){ toast('Paste the VAPID public key first 🔑'); return; }
  if(Notification.permission !== 'granted'){ await enableNotifications(); if(Notification.permission !== 'granted') return; }
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub){ const cur = sub.options && sub.options.applicationServerKey; const want = b64ToBytes(key);
      if(!cur || new Uint8Array(cur).join() !== want.join()){ await sub.unsubscribe(); sub = null; } }
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(key)});
    const snap = reminderSnapshot();
    const cfg = { v:1, tz:Intl.DateTimeFormat().resolvedOptions().timeZone, name:snap.name, nextPeriod:snap.nextPeriod, avgCycle:snap.avgCycle,
      reminders:S.notify.reminders.filter(r=>r.on), subscription:sub.toJSON() };
    const out = sheet.querySelector('#pushOut'); out.style.display = 'block'; out.value = JSON.stringify(cfg);
    try{ await navigator.clipboard.writeText(out.value); toast('Copied! Paste it into the PUSH_CONFIG secret 📋'); }catch(e){ out.select(); toast('Copy the code below into the PUSH_CONFIG secret'); }
  }catch(err){ toast('Couldn\'t subscribe: ' + esc(err.message || err)); }
}

const MOOD_WORDS = {'😎':'Confident','😊':'Happy','😐':'Meh','😢':'Sad','😤':'Annoyed','😴':'Sleepy'};
const ymOf = k => k.slice(0,7);

const isLastDay = k => addDays(k,1).slice(8) === '01';
const monthDays = ym => { const [y,m] = ym.split('-').map(Number); return Array.from({length:new Date(y,m,0).getDate()}, (_,i)=>`${ym}-${pad(i+1)}`); };
const tsIn = (ts, ym) => !!ts && key(new Date(ts)).startsWith(ym);
function monthHasData(ym){

  return has(S.sugar) || has(S.sleep) || has(S.period) || S.movies.some(m => tsIn(m.addedAt,ym) || tsIn(m.watchedAt,ym));

// On the last evening of a month, that month's report is ready; otherwise last month's.
const reportCandidate = () => { const t = today(); return isLastDay(t) && new Date().getHours() >= 18 ? ymOf(t) : shiftMonth(ymOf(t), -1); };

function monthStats(ym){
  const t = today(), all = monthDays(ym), days = all.filter(k => k <= t);
  const sugarFree = days.filter(k => S.sugar[k]==='free').length, sugarSlip = days.filter(k => S.sugar[k]==='slip').length;
  let run = 0, sugarBest = 0;
  for(const k of all){ if(S.sugar[k]==='free'){ run++; sugarBest = Math.max(sugarBest, run); } else run = 0; }
  const sl = all.filter(k => S.sleep[k]).map(k => ({k, h:sleepHours(S.sleep[k])}));
  const avgSleep = sl.length ? mean(sl.map(x=>x.h)) : 0;
  const goodN = sl.filter(x => x.h >= Math.min(7, S.settings.sleepGoal)).length;
  const bestNight = sl.reduce((a,b) => !a || b.h > a.h ? b : a, null);
  const ps = periods().filter(p => p.start.startsWith(ym) || p.end.startsWith(ym));
  const sym = {}, moods = {};
  all.forEach(k => { const p = S.period[k]; if(!p) return;
    (p.symptoms||[]).forEach(x => sym[x] = (sym[x]||0)+1); if(p.mood) moods[p.mood] = (moods[p.mood]||0)+1; });
  const watched = S.movies.filter(m => m.watched && tsIn(m.watchedAt,ym)).sort((a,b)=>a.watchedAt-b.watchedAt);
  const added = S.movies.filter(m => tsIn(m.addedAt,ym));
  const checkins = days.filter(checkedIn).length, perfect = days.filter(perfectDay).length;
  let xp = 0;
  days.forEach(k => { if(S.sugar[k]) xp += S.sugar[k]==='free' ? 20 : 5; if(S.sleep[k]) xp += 10 + (goodSleep(k) ? 10 : 0); if(S.period[k]) xp += 8; if(perfectDay(k)) xp += 30; });

function verdict(m){

const avPngCache = {};
function avatarPng(id){
  if(avPngCache[id] !== undefined) return Promise.resolve(avPngCache[id]);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
        x.save(); x.beginPath(); x.arc(128,128,120,0,Math.PI*2); x.clip(); x.drawImage(img,8,8,240,240); x.restore();
        x.lineWidth = 6; x.strokeStyle = '#d0d0d6'; x.beginPath(); x.arc(128,128,120,0,Math.PI*2); x.stroke();
        res(avPngCache[id] = c.toDataURL('image/png'));
      }catch(e){ res(avPngCache[id] = null); }
    };
    img.onerror = () => res(avPngCache[id] = null);
    img.src = S.portraits[id] || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="240" height="240">${ART[id]}</svg>`);
  });
}

  // closing message
  const lines = doc.splitTextToSize(latin(vt), CW-32), bh = Math.max(28, 15 + lines.length*4.4);
  y += 1; newPageIf(bh+1);
  fill(C.navy); doc.roundedRect(M, y, CW, bh, 4, 4, 'F'); putAv(vh, M+5, y+5, 18);
  color([245,179,1]); font(10.5,'bold'); doc.text(latin(`Message from ${HEROES[vh].n}`), M+28, y+9.5);
  color([235,238,248]); font(9.5); doc.text(lines, M+28, y+15.5);

  const pages = doc.getNumberOfPages();
  for(let i=1; i<=pages; i++){ doc.setPage(i); color(C.muted); font(7.5);
    doc.text(latin(`Hero Quest  |  Generated ${nice(today())} ${new Date().getFullYear()}  |  Personal tracker - not medical advice`), M, 290);
    doc.text(`${i}/${pages}`, W-M, 290, {align:'right'}); }
  return {blob: doc.output('blob'), m};
}
async function openReport(ym){
  if(!S.meta.reportSeen || S.meta.reportSeen < ym){ S.meta.reportSeen = ym; save(); }
  const head = `<h3 class="fred">${monthLabel(ym)} Mission Report</h3>`;
  openSheet(`${head}<div class="spin">Preparing your debrief… ⚡</div>`);
  sheet.onclick = null;
  try{
    const {blob, m} = await buildReportPdf(ym);
    if(!sheetbg.classList.contains('open')) return;
    const url = URL.createObjectURL(blob), fname = `Hero-Quest-${ym}.pdf`;
    const file = typeof File === 'function' ? new File([blob], fname, {type:'application/pdf'}) : null;
    const canShare = !!(file && navigator.canShare && navigator.canShare({files:[file]}));
    sheet.innerHTML = `${head}
      <div class="grid2">
        <div class="stat"><b>+${m.xp}</b><span>XP earned</span></div>
        <div class="stat"><b>${m.checkins}/${m.days.length}</b><span>check-in days</span></div>
        <div class="stat"><b>${m.sugarFree}</b><span>sugar-free days</span></div>
        <div class="stat"><b>${m.sl.length ? m.avgSleep.toFixed(1)+'h' : '—'}</b><span>average sleep</span></div>
      </div>
      <div class="row" style="margin-top:14px;flex-wrap:wrap">
        <a class="btn" style="flex:1" href="${url}" target="_blank" rel="noopener">Open PDF</a>
        <a class="btn soft" style="flex:1" href="${url}" download="${fname}">Save</a>
        ${canShare ? '<button class="btn lav" style="flex:1" data-p="share">Share</button>' : ''}
      </div>
      <p class="disc">Made on this phone — your data never leaves it.</p>`;
    sheet.onclick = async e => { if(e.target.closest('[data-p=share]')){ try{ await navigator.share({files:[file], title:`${monthLabel(ym)} Mission Report`}); }catch(err){} } };
  }catch(err){
    const box = sheet.querySelector('.spin'); if(box) box.textContent = 'Couldn\'t create the PDF: ' + (err.message || err);
  }
}
function openTabParam(t){
  if(!t) return;
  if(/^report-\d{4}-\d{2}$/.test(t)){ openReport(t.slice(7)); return; }
  if(VIEWS[t]){ tab = t; closeSheet(); render(); }
}

/* ---------------- custom hero portraits (stored only on this device) ---------------- */
function portraitsSheet(){
  const ids = [...ROSTER, 'sugaros'];
  openSheet(`<h3>Hero portraits</h3>
    <p class="small muted" style="margin-top:-6px">Tap a hero to use your own picture for them. It's cropped to a circle and saved only on this phone.</p>
    <div class="portraits">${ids.map(id=>`<button data-pr="pick" data-id="${id}">${av(id,56)}<span>${HEROES[id].n}</span>${S.portraits[id]?`<span class="set" data-pr="reset" data-id="${id}">Reset</span>`:''}</button>`).join('')}</div>
    <button class="btn soft block" style="margin-top:18px" data-pr="back">Done</button>`);
  sheet.onclick = e => {
    const b = e.target.closest('[data-pr]'); if(!b) return;
    const id = b.dataset.id;
    if(b.dataset.pr === 'back'){ settingsSheet(); return; }
    if(b.dataset.pr === 'reset'){ e.stopPropagation(); delete S.portraits[id]; delete avPngCache[id]; save(); render(); portraitsSheet(); return; }
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => { const f = inp.files[0]; if(!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const sz = 256, c = document.createElement('canvas'); c.width = c.height = sz;
        const side = Math.min(img.width, img.height), sx = (img.width-side)/2, sy = (img.height-side)/2.6;   // centre crop, biased up for faces
        c.getContext('2d').drawImage(img, sx, Math.max(0,sy), side, side, 0, 0, sz, sz);
        URL.revokeObjectURL(url);
        try{ S.portraits[id] = c.toDataURL('image/jpeg', .85); delete avPngCache[id]; save(); render(); portraitsSheet(); toast(`${HEROES[id].n} updated`); }
        catch(err){ toast('Could not use that image'); }
      };
      img.onerror = () => toast('Could not read that image');
      img.src = url;
    };
    inp.click();
  };
}
document.addEventListener('submit', e => {
  if(e.target.id !== 'movieForm') return;
  e.preventDefault();
  const f = new FormData(e.target), t = String(f.get('title')||'').trim();
  if(!t) return;
  if(S.movies.some(m=>m.title.toLowerCase()===t.toLowerCase())){ toast('Already on the list! 🎬'); return; }
  S.movies.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:t, genre:f.get('genre'), addedAt:Date.now(), watched:false, watchedAt:null, rating:0});
  movieFilter = 'todo'; commit();
  const inp = document.querySelector('#movieForm [name=title]'); if(inp) inp.focus();
});

document.getElementById('sparkles').innerHTML = Array.from({length:14},(_,i)=>
  `<span style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${.8+Math.random()*1.2}rem;animation-delay:${-Math.random()*9}s">${['⭐','⚡','✦','⭐','💫'][i%5]}</span>`).join('');
load(); celebrate(); render();
if(!S.meta.storySeen) playStory();
/* report helpers are defined above */
const qtab = new URLSearchParams(location.search).get('tab');
openTabParam(qtab);
if(hasSW()){
  navigator.serviceWorker.register('sw.js').then(() => { syncReminderState(); if(S.notify.enabled) registerPeriodic(); }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.type==='open-tab') openTabParam(e.data.tab); });
}
syncReminderState();
setTimeout(checkReminders, 1500);
setInterval(checkReminders, 30000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') checkReminders(); });
// re-render after midnight so "today" stays fresh
setInterval(() => { if(document.visibilityState==='visible' && !sheetbg.classList.contains('open')) render(); }, 60000);
})();
