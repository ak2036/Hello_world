<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hero Quest">
<title>Ankitha's Hero Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e62429; --red-2:#ff5a4e; --gold:#f5b301; --gold-2:#ffd45c;
  --blue:#3b82f6; --blue-2:#1e3a8a; --purple:#8b5cf6; --green:#22c55e;
  --bg:#0a0e1a; --card:#141a2b; --card-2:#1b2338; --ink:#e9edf8; --muted:#8e98b8; --line:rgba(255,255,255,.09);
  --shadow:0 10px 28px rgba(0,0,0,.45);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Rajdhani,system-ui,sans-serif;font-weight:500;color:var(--ink);font-size:16.5px;
  background:var(--bg);
  background-image:radial-gradient(circle at 15% 0%,rgba(230,36,41,.28),transparent 45%),radial-gradient(circle at 100% 35%,rgba(59,130,246,.22),transparent 45%),radial-gradient(circle at 0% 100%,rgba(245,179,1,.12),transparent 40%);
  background-attachment:fixed;min-height:100vh;padding-bottom:96px;
}
h1,h2,h3,.fred{font-family:Bangers,Impact,sans-serif;letter-spacing:.06em;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* floating stars */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkles span{position:absolute;opacity:.25;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(15deg)}}

/* header */
header{position:relative;z-index:1;padding:18px 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{margin:0;font-size:1.75rem;line-height:1;text-shadow:2px 2px 0 var(--red)}
.title small{display:block;font-family:Rajdhani;letter-spacing:0;text-shadow:none;font-size:.85rem;color:var(--muted);font-weight:600;margin-top:4px}
.gear{width:42px;height:42px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:1.2rem;flex:none}
.levelcard{margin-top:12px;background:linear-gradient(120deg,#b3141a,#e62429 45%,#7a0f12);color:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:0 12px 30px rgba(230,36,41,.35);position:relative;overflow:hidden;border:1px solid rgba(255,212,92,.35)}
.levelcard:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.12) 0 10px,transparent 10px 20px)}
.lvrow{display:flex;align-items:center;gap:12px;position:relative}
.lvbadge{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#2f6fe0 0 34%,#fff 35% 46%,#e62429 47% 64%,#fff 65% 78%,#e62429 79%);display:grid;place-items:center;font-family:Bangers;font-size:1.35rem;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4);text-shadow:1px 1px 0 #000}
.lvbadge small{display:block;font-size:.6rem;margin-bottom:-6px;opacity:.95}
.lvname{font-family:Bangers;letter-spacing:.06em;font-size:1.25rem}
.xpbar{height:12px;background:rgba(0,0,0,.35);border-radius:99px;margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px;box-shadow:0 0 10px var(--gold);transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.xptext{font-size:.85rem;margin-top:4px;opacity:.95;font-weight:600}

/* cards */
main{position:relative;z-index:1}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.4rem;display:flex;align-items:center;gap:8px}
.card h2 .sub{margin-left:auto;font-family:Rajdhani;letter-spacing:0;font-size:.85rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Bangers;letter-spacing:.05em;font-weight:400;font-size:1.7rem;color:var(--gold)}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}

.btn{background:linear-gradient(135deg,var(--red),var(--red-2));color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 6px 16px rgba(230,36,41,.4);transition:transform .12s;text-transform:uppercase;letter-spacing:.04em}
.btn:active{transform:scale(.95)}
.btn.soft{background:var(--card);color:var(--gold);box-shadow:none;border:1px solid var(--line)}
.btn.lav{background:linear-gradient(135deg,var(--blue-2),var(--blue));box-shadow:0 6px 16px rgba(59,130,246,.35)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:99px;background:var(--card);color:var(--ink);font-weight:600;font-size:.9rem;margin:3px;border:1px solid var(--line);transition:all .15s}
.chip.on{background:var(--red);color:#fff;border-color:var(--gold);box-shadow:0 4px 10px rgba(230,36,41,.4)}

/* mascot */
.pet{display:flex;gap:14px;align-items:center}
.pet .face{font-size:3.2rem;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 50%,#7fd4ff 0,#2b6cb0 45%,#0b1a33 72%);box-shadow:0 0 22px rgba(127,212,255,.55),inset 0 0 0 3px rgba(255,255,255,.2);flex:none;animation:bob 2.6s ease-in-out infinite;cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{background:var(--card);border:1px solid rgba(127,212,255,.35);border-radius:14px;padding:10px 12px;font-weight:600;font-size:.98rem;position:relative;color:#cfe9ff}
.bubble:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:rgba(127,212,255,.35);border-left:0}

/* missions */
.quest{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px dashed rgba(255,255,255,.15);margin-bottom:10px}
.quest.done{background:linear-gradient(120deg,rgba(230,36,41,.18),rgba(245,179,1,.1));border-style:solid;border-color:rgba(245,179,1,.5)}
.quest .ico{font-size:1.6rem;width:44px;height:44px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:12px;flex:none}
.quest .txt{flex:1;min-width:0}
.quest .txt b{display:block;font-family:Bangers;letter-spacing:.05em;font-weight:400;font-size:1.1rem}
.quest .txt span{font-size:.85rem;color:var(--muted);font-weight:600}
.quest .xp{white-space:nowrap;display:inline-block;font-family:Rajdhani;letter-spacing:0;font-size:.72rem;font-weight:700;color:#111;background:var(--gold);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.check{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:700;flex:none}
.perfect{height:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.perfect i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}

/* cycle ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:138px;height:138px;flex:none}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(230,36,41,.45))}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-family:Bangers;font-weight:400;font-size:2.4rem;color:var(--gold);display:block;line-height:1}
.ring .mid span{font-size:.75rem;color:var(--muted);font-weight:700}
.phase{font-family:Bangers;letter-spacing:.05em;font-size:1.35rem}
.tip{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.35);border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:600;margin-top:10px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:1.25rem}
.calhead button{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.92rem;font-weight:700;background:var(--card);border:1px solid var(--line);position:relative;transition:transform .1s}
.cal .d:active{transform:scale(.9)}
.cal .d.empty{background:none;border:0}
.cal .d.today{outline:2.5px solid var(--gold);outline-offset:-2px}
.cal .d.future{opacity:.8}
.cal .d.period{background:linear-gradient(135deg,var(--red),#a3141a);color:#fff;border-color:transparent}
.cal .d.spot{background:rgba(230,36,41,.3)}
.cal .d.pred{background:repeating-linear-gradient(45deg,rgba(230,36,41,.15),rgba(230,36,41,.15) 4px,rgba(230,36,41,.35) 4px,rgba(230,36,41,.35) 8px);color:#ffb3b0}
.cal .d.fert{background:rgba(139,92,246,.25);color:#cdb8ff}
.cal .d.ovu{background:rgba(139,92,246,.55);color:#fff}
.cal .d.free{background:linear-gradient(135deg,#15803d,var(--green));color:#fff;border-color:transparent}
.cal .d.slip{background:rgba(245,179,1,.2);color:var(--gold-2)}
.cal .d .em{position:absolute;bottom:1px;right:3px;font-size:.6rem}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

/* sugar */
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigchoice button{padding:14px 10px;border-radius:14px;font-family:Bangers;letter-spacing:.05em;font-size:1.15rem;background:var(--card);border:2px solid var(--line);transition:all .15s}
.bigchoice button .e{display:block;font-size:2rem;margin-bottom:4px}
.bigchoice button.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(230,36,41,.3),rgba(245,179,1,.15));box-shadow:0 0 16px rgba(245,179,1,.3)}
.flame{font-size:3rem;text-align:center;line-height:1}
.jar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.jar i{aspect-ratio:1;border-radius:6px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.85rem}
.jar i.on{background:linear-gradient(135deg,#7a0f12,var(--red));border-color:var(--gold);box-shadow:0 0 6px rgba(245,179,1,.4)}

/* sleep chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:16px;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);font-size:.7rem;color:var(--gold);font-weight:700}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{width:100%;max-width:38px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#7fd4ff,var(--blue-2));box-shadow:0 0 10px rgba(59,130,246,.4);transition:height .6s}
.bar i.low{background:linear-gradient(180deg,var(--red-2),#7a0f12);box-shadow:none}
.bar span{font-size:.72rem;font-weight:700;color:var(--muted)}
.bar b{font-size:.75rem;color:var(--ink)}
.hearts button{font-size:1.7rem;padding:2px;filter:grayscale(1);opacity:.35;transition:all .15s}
.hearts button.on{filter:none;opacity:1;transform:scale(1.1)}
.listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.listrow:last-child{border-bottom:0}
.listrow b.fred{font-size:1.1rem}
.x{width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--red-2);font-weight:700;flex:none}

/* movies */
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#0d1222;outline:none;color-scheme:dark}
.field:focus{border-color:var(--gold)}
.field::placeholder{color:var(--muted)}
.movie{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.movie .poster{width:48px;height:62px;border-radius:8px;display:grid;place-items:center;font-size:1.6rem;flex:none;background:linear-gradient(160deg,#7a0f12,var(--blue-2));border:1px solid rgba(245,179,1,.35)}
.movie .info{flex:1;min-width:0}
.movie .info b{display:block;font-family:Bangers;letter-spacing:.05em;font-weight:400;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.movie .info span{font-size:.82rem;color:var(--muted);font-weight:600}
.seg{display:flex;background:#0d1222;border:1px solid var(--line);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--muted);font-size:.92rem}
.seg button.on{background:var(--red);color:#fff}
.spin{font-family:Bangers;letter-spacing:.05em;font-size:1.7rem;text-align:center;padding:26px 10px;border-radius:14px;background:radial-gradient(circle,rgba(230,36,41,.3),#0d1222 70%);border:1px solid rgba(245,179,1,.35);min-height:90px;display:grid;place-items:center}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.badge .e{font-size:2.1rem;display:block}
.badge b{display:block;font-family:Bangers;letter-spacing:.05em;font-weight:400;font-size:.98rem;margin-top:4px}
.badge span{font-size:.72rem;color:var(--muted);font-weight:600;display:block;margin-top:2px}
.badge.locked .e{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.badge.got{background:linear-gradient(150deg,rgba(230,36,41,.25),rgba(245,179,1,.12));border-color:rgba(245,179,1,.55);box-shadow:0 0 14px rgba(245,179,1,.18)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-top:2px solid var(--red);border-radius:20px 20px 0 0}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;min-width:52px;font-size:.72rem;font-weight:700;color:var(--muted);transition:all .15s}
nav button .e{font-size:1.35rem;transition:transform .2s}
nav button.on{color:var(--gold);background:rgba(230,36,41,.2)}
nav button.on .e{transform:translateY(-2px) scale(1.15)}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--card-2);border-top:3px solid var(--red);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:1.6rem}
.sheet label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* toast + confetti */
.toasts{position:fixed;top:14px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#0d1222;color:var(--ink);border:1px solid var(--gold);padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 14px rgba(245,179,1,.25);font-weight:700;animation:pop .35s cubic-bezier(.2,.9,.3,1.4),fade .4s 2.4s forwards}
@keyframes pop{from{transform:scale(.6) translateY(-10px);opacity:0}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}
.confetti{position:fixed;top:-30px;z-index:45;pointer-events:none;font-size:1.4rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.levelup{text-align:center;padding:10px 0}
.levelup .e{font-size:4.5rem;animation:bob 1.4s ease-in-out infinite}
.levelup h3{font-size:2.2rem;margin:6px 0;color:var(--gold);text-shadow:2px 2px 0 var(--red)}
.disc{font-size:.78rem;color:var(--muted);text-align:center;margin:10px 0 0}
.av{display:inline-block;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 14px rgba(245,179,1,.35);flex:none;line-height:0;background:#000;vertical-align:middle}
.av svg{display:block;width:100%;height:100%}
.av.locked{border-color:#3a4260;box-shadow:none}
.av.locked svg{filter:grayscale(1) brightness(.3)}
.lvrow > .av{margin-left:-22px;margin-top:30px;border-width:2px;position:relative}
.pet .face{width:auto;height:auto;background:none;box-shadow:none;border-radius:50%;padding:0}
.pet .face.zap{animation:zap .4s}
@keyframes zap{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}
.who{font-family:Bangers;color:var(--gold);letter-spacing:.07em;margin:0 0 4px 2px;font-size:1.05rem}
.mentor{padding:14px}
.boss{border-color:rgba(139,92,246,.45);background:linear-gradient(135deg,#24123a,var(--card))}
.boss .av{border-color:#8b5cf6;box-shadow:0 0 16px rgba(139,92,246,.5)}
.hp{height:12px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(139,92,246,.4);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#d946ef);transition:width .8s}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;text-align:center}
.roster b{display:block;font-family:Bangers;font-weight:400;letter-spacing:.04em;font-size:.82rem;margin-top:4px;line-height:1.1}
.roster span{display:block;font-size:.66rem;color:var(--muted);font-weight:600}
.roster .locked b{color:var(--muted)}
.levelup .e{font-size:1rem;animation:bob 1.4s ease-in-out infinite;margin:8px 0}
.levelup .bubble{text-align:left}

/* story mode */
.story{position:fixed;inset:0;z-index:60;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;user-select:none;
  background:#03040a;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 25% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 35%,#cfe3ff,transparent),radial-gradient(1px 1px at 92% 90%,#fff,transparent),radial-gradient(circle at 50% 120%,rgba(230,36,41,.35),transparent 60%);
  animation:fadein .5s}
.story.out{animation:fadeout .45s forwards}
@keyframes fadein{from{opacity:0}} @keyframes fadeout{to{opacity:0;transform:scale(1.05)}}
.story .bars-top,.story .bars-bot{position:absolute;left:0;right:0;height:7vh;background:#000}
.story .bars-top{top:0} .story .bars-bot{bottom:0}
.story .skip{position:absolute;top:calc(7vh + 10px);right:14px;z-index:2;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:99px;font-weight:700;font-size:.85rem}
.story .stage{width:100%;max-width:520px;padding:0 20px}
.story .panel{text-align:center;animation:panelin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes panelin{from{opacity:0;transform:scale(.92) translateY(14px)}}
.story .caption{margin-top:16px;padding:14px 16px;font-weight:700;font-size:1.08rem;line-height:1.4;text-align:left;min-height:96px}
.story .narr{background:#ffd43b;color:#1a1300;border:3px solid #000;box-shadow:5px 5px 0 #000;border-radius:4px}
.story .speech{background:#fff;color:#111;border:3px solid #000;border-radius:18px;box-shadow:5px 5px 0 var(--red);position:relative}
.story .speech:before{content:"";position:absolute;top:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:#000;border-top:0;border-width:0 12px 14px}
.story .who{font-size:1.5rem;margin-top:10px}
.story .bigav .av{border-width:4px;box-shadow:0 0 40px rgba(245,179,1,.45)}

@keyframes menace{50%{transform:scale(1.05)}}
.story .globe{font-size:7rem;filter:drop-shadow(0 0 30px rgba(59,130,246,.7));animation:bob 3s ease-in-out infinite}
.story .team{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.story .team small{display:block;font-family:Bangers;letter-spacing:.05em;font-size:.8rem;color:var(--gold);margin-top:4px}
.story .tap{margin-top:16px;font-size:.85rem;color:rgba(255,255,255,.6);font-weight:700;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.titlecard{position:relative}
.tc-name{font-family:Bangers;font-size:1.6rem;letter-spacing:.12em;color:#fff;opacity:.9}
.tc-logo{display:inline-block;font-family:Bangers;font-size:clamp(3rem,15vw,4.8rem);letter-spacing:.06em;line-height:1;color:#fff;background:var(--red);padding:10px 18px 4px;margin:8px 0;box-shadow:0 0 50px rgba(230,36,41,.6);animation:flick 1.6s ease-out}
@keyframes flick{0%{transform:scale(2.2);opacity:0;filter:blur(6px)}40%{opacity:1;filter:blur(0)}55%{transform:scale(.96)}100%{transform:scale(1)}}
.tc-sub{font-family:Bangers;letter-spacing:.2em;color:var(--gold);font-size:1.1rem}
.tc-flash{position:fixed;inset:0;background:#fff;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.7}to{opacity:0}}
</style>

<input type="file" id="importFile" accept="application/json" hidden>

<script>
(() => {
'use strict';

/* ---------------- storage ---------------- */
const STORE = 'glowquest.v1'; // kept so existing data carries over
const DEFAULT = {
  settings:{ name:'Ankitha', cycleLen:28, sleepGoal:8 },
  period:{},   // 'YYYY-MM-DD': {flow:'none|spotting|light|medium|heavy', symptoms:[], mood:''}
  sugar:{},    // 'YYYY-MM-DD': 'free' | 'slip'
  sleep:{},    // 'YYYY-MM-DD' (morning you woke up): {bed:'23:00', wake:'07:00', q:1-5}
  movies:[],   // {id,title,genre,addedAt,watched,watchedAt,rating}
  meta:{ lastXP:null, lastLevel:null, seenBadges:[], storySeen:false }
};
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(STORE)) || null; }catch(e){ S = null; }
  S = Object.assign(structuredClone(DEFAULT), S || {});
  S.settings = Object.assign({}, DEFAULT.settings, S.settings);
  S.meta = Object.assign({}, DEFAULT.meta, S.meta);
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }

/* ---------------- date helpers ---------------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => key(new Date());
const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const dowShort = k => ['Su','Mo','Tu','We','Th','Fr','Sa'][parse(k).getDay()];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;

/* ---------------- derived: cycle ---------------- */
const BLEED = ['light','medium','heavy'];
function periods(){
  const days = Object.keys(S.period).filter(k => BLEED.includes(S.period[k].flow)).sort();
  const out = [];
  for(const d of days){
    const last = out[out.length-1];
    if(last && diffDays(last.end,d) <= 2){ last.end = d; }
    else out.push({start:d,end:d});
  }
  out.forEach(p => p.len = diffDays(p.start,p.end)+1);
  return out;
}
function cycleInfo(){
  const ps = periods(), t = today();
  const gaps = [];
  for(let i=1;i<ps.length;i++){ const g = diffDays(ps[i-1].start, ps[i].start); if(g>=15 && g<=60) gaps.push(g); }
  const avg = gaps.length ? Math.round(mean(gaps.slice(-6))) : S.settings.cycleLen;
  const plen = ps.length ? Math.max(2, Math.min(10, Math.round(mean(ps.slice(-6).map(p=>p.len))))) : 5;
  const ovulDay = avg - 14;
  if(!ps.length) return {avg, plen, ovulDay, none:true, ps, cycles:0};
  const last = ps[ps.length-1];
  const day = diffDays(last.start, t) + 1;
  const next = addDays(last.start, avg);
  const until = diffDays(t, next);
  let phase, emoji, tip;
  if(day <= last.len || day <= plen && diffDays(last.end,t) <= 1){ phase='Recovery Mode'; emoji='🛡️'; tip='Even Avengers rest between battles: hot water bottle, iron-rich snacks and extra sleep. You\'ve got this, Captain 💪'; }
  else if(day < ovulDay-5){ phase='Power Rising'; emoji='⚡'; tip='Power levels climbing! Great time for training, a new mission or a fun plan ⚡'; }
  else if(day === ovulDay){ phase='Ovulation Day'; emoji='🌟'; tip='Peak power day! Estimated ovulation — energy level: cosmic 🌟'; }
  else if(day <= ovulDay+1){ phase='Fertile Window'; emoji='💫'; tip='Estimated fertile window. Feeling strong and social? That\'s the hormones suiting up 💫'; }
  else if(day <= avg){ phase='Shields Charging'; emoji='🔋'; tip='Cravings incoming — dark chocolate & magnesium are your sidekicks. Be gentle with yourself, hero 🫶'; }
  else { phase='Incoming Alert'; emoji='🚨'; tip='Your period may arrive any day now. Pack the emergency kit & log it when it starts!'; }
  return {avg, plen, ovulDay, last, day, next, until, phase, emoji, tip, ps, cycles:ps.length};
}
function cycleMarks(ci){
  const pred = new Set(), fert = new Set(), ovu = new Set();
  if(ci.none) return {pred,fert,ovu};
  for(let k=0;k<=4;k++){
    const start = addDays(ci.last.start, ci.avg*k);
    if(k>0) for(let i=0;i<ci.plen;i++) pred.add(addDays(start,i));
    const ov = addDays(start, ci.ovulDay-1);
    ovu.add(ov);
    for(let i=-5;i<=1;i++) if(i!==0) fert.add(addDays(ov,i));
  }
  return {pred,fert,ovu};
}

/* ---------------- derived: streaks ---------------- */
function streakEndingToday(test){
  let d = today(), n = 0;
  if(!test(d)) d = addDays(d,-1); // today not logged yet doesn't break the streak
  while(test(d)){ n++; d = addDays(d,-1); }
  return n;
}
function bestStreak(keys, test){
  const ks = keys.filter(test).sort(); let best=0, cur=0, prev=null;
  for(const k of ks){ cur = (prev && diffDays(prev,k)===1) ? cur+1 : 1; best = Math.max(best,cur); prev = k; }
  return best;
}
const sleepHours = s => { const [bh,bm]=s.bed.split(':').map(Number), [wh,wm]=s.wake.split(':').map(Number); let m=(wh*60+wm)-(bh*60+bm); if(m<=0) m+=1440; return m/60; };
const isFree = k => S.sugar[k]==='free';
const goodSleep = k => S.sleep[k] && sleepHours(S.sleep[k]) >= Math.min(7, S.settings.sleepGoal);
const checkedIn = k => !!(S.sugar[k] || S.sleep[k] || S.period[k]);
const perfectDay = k => !!(S.sugar[k] && S.sleep[k] && S.period[k]);

/* ---------------- game: badges, xp, levels ---------------- */
function stats(){
  const ci = cycleInfo();
  const sugarKeys = Object.keys(S.sugar), sleepKeys = Object.keys(S.sleep);
  const allDays = new Set([...sugarKeys, ...sleepKeys, ...Object.keys(S.period)]);
  return {
    ci,
    sugarFree: sugarKeys.filter(isFree).length,
    sugarStreak: streakEndingToday(isFree),
    sugarBest: bestStreak(sugarKeys, isFree),
    sleepLogs: sleepKeys.length,
    sleepStreak: streakEndingToday(goodSleep),
    sleepBest: bestStreak(sleepKeys, goodSleep),
    periodLogs: Object.keys(S.period).length,
    added: S.movies.length,
    watched: S.movies.filter(m=>m.watched).length,
    rated: S.movies.filter(m=>m.rating).length,
    perfect: [...allDays].filter(perfectDay).length,
    checkStreak: streakEndingToday(checkedIn),
    checkBest: bestStreak([...allDays], checkedIn),
  };
}
const BADGES = [
  {id:'sugar1',  e:'🛡️', n:'Shield Up',       d:'1st sugar-free day',      t:s=>s.sugarFree>=1},
  {id:'sugar3',  e:'💚', n:'Sugar Smash',      d:'3-day sugar-free streak', t:s=>s.sugarBest>=3},
  {id:'sugar7',  e:'🔨', n:'Worthy',    d:'7-day sugar-free streak', t:s=>s.sugarBest>=7},
  {id:'sugar30', e:'🧤', n:'Infinity Gauntlet',  d:'30-day streak',           t:s=>s.sugarBest>=30},
  {id:'sleep1',  e:'🌙', n:'Night Watch',      d:'Log your 1st night',      t:s=>s.sleepLogs>=1},
  {id:'sleep5',  e:'🕸️', n:'Spidey Recharged',   d:'5 good nights in a row',  t:s=>s.sleepBest>=5},
  {id:'sleep14', e:'🔮', n:'Sleep Supreme',    d:'14 good nights in a row', t:s=>s.sleepBest>=14},
  {id:'cycle1',  e:'🟢', n:'Time Stone',   d:'1st cycle check-in',      t:s=>s.periodLogs>=1},
  {id:'cycle3',  e:'🌌', n:'Multiverse Seer',       d:'Track 3 periods',         t:s=>s.ci.cycles>=3},
  {id:'movie1',  e:'🍿', n:'Movie Recruit',  d:'Add 1st movie',           t:s=>s.added>=1},
  {id:'movie5',  e:'🎬', n:'Assemble!',   d:'Watch 5 movies',          t:s=>s.watched>=5},
  {id:'movie15', e:'🏆', n:'Endgame',      d:'Watch 15 movies',         t:s=>s.watched>=15},
  {id:'perfect1',e:'⚡', n:'Thunder Strike',       d:'All 3 missions in a day',   t:s=>s.perfect>=1},
  {id:'perfect7',e:'💎', n:'All Six Stones',    d:'7 perfect days',          t:s=>s.perfect>=7},
  {id:'streak7', e:'🦾', n:'Iron Will',           d:'Check in 7 days in a row',t:s=>s.checkBest>=7},
];
function computeXP(s){
  let xp = 0;
  for(const k in S.sugar) xp += S.sugar[k]==='free' ? 20 : 5; // honesty still counts!
  for(const k in S.sleep) xp += 10 + (goodSleep(k) ? 10 : 0);
  xp += s.periodLogs * 8;
  xp += s.added * 5 + s.watched * 25 + s.rated * 5;
  xp += s.perfect * 30;
  xp += BADGES.filter(b=>b.t(s)).length * 50;
  return xp;
}
const levelFor = xp => Math.floor((1 + Math.sqrt(1 + 8*xp/100)) / 2);
const xpAt = L => 50*L*(L-1);
const TITLES = ['Rookie Recruit','S.H.I.E.L.D. Agent','Master Archer','Web-Slinger','Wakandan Warrior','Gamma Smasher','Sorcerer Supreme','Worthy of Thunder','Cosmic Captain','Iron Avenger','Earth\'s Mightiest Hero'];
const title = L => TITLES[Math.min(L-1, TITLES.length-1)];
const pet = L => heroForLevel(L);

/* ---------------- heroes (original emblem-style fan art, drawn in SVG) ---------------- */
const starPts = (cx,cy,R,r,n) => Array.from({length:n*2},(_,i)=>{ const a=Math.PI/n*i-Math.PI/2, d=i%2?r:R; return `${(cx+d*Math.cos(a)).toFixed(1)},${(cy+d*Math.sin(a)).toFixed(1)}`; }).join(' ');
const webLines = Array.from({length:8},(_,i)=>{ const a=Math.PI/4*i; return `<path d="M50 50 L${(50+75*Math.cos(a)).toFixed(1)} ${(50+75*Math.sin(a)).toFixed(1)}"/>`; }).join('');
const ART = {
  fury:`<rect width="100" height="100" fill="#1a1d26"/><path d="M10 100 L28 76 L50 88 L72 76 L90 100Z" fill="#050508"/><ellipse cx="50" cy="50" rx="24" ry="29" fill="#7a4a2e"/><path d="M22 58 L78 30" stroke="#050508" stroke-width="3"/><ellipse cx="40" cy="50" rx="8" ry="6.5" fill="#050508"/><ellipse cx="60" cy="49" rx="4.5" ry="3" fill="#fff"/><circle cx="60" cy="49" r="2" fill="#222"/><path d="M54 43 L67 41" stroke="#3a2214" stroke-width="2.5"/><path d="M42 68 Q50 72 58 68" stroke="#3a2214" stroke-width="2.5" fill="none"/>`,

  cap:`<rect width="100" height="100" fill="#0b1a33"/><circle cx="50" cy="50" r="46" fill="#c8161d"/><circle cx="50" cy="50" r="37" fill="#f2f2f2"/><circle cx="50" cy="50" r="28" fill="#c8161d"/><circle cx="50" cy="50" r="19" fill="#1d4ed8"/><polygon points="${starPts(50,50,17,6.8,5)}" fill="#fff"/>`,
  thor:`<rect width="100" height="100" fill="#1b2f6b"/><path d="M14 8 L24 28 L17 28 L28 50" stroke="#ffe066" stroke-width="3" fill="none"/><path d="M86 12 L76 31 L83 31 L72 52" stroke="#ffe066" stroke-width="3" fill="none"/><rect x="46.5" y="46" width="7" height="40" rx="2" fill="#7a4b2a"/><path d="M46.5 56 L53.5 60 M46.5 64 L53.5 68 M46.5 72 L53.5 76" stroke="#5a3519" stroke-width="2"/><rect x="26" y="22" width="48" height="26" rx="4" fill="#a7b0c0" stroke="#5d6676" stroke-width="2"/><path d="M34 35 L66 35" stroke="#7b8494" stroke-width="2"/><circle cx="50" cy="90" r="4" fill="#5d6676"/>`,
  hulk:`<rect width="100" height="100" fill="#4a2a6b"/><ellipse cx="50" cy="57" rx="32" ry="34" fill="#4f9d3a"/><path d="M18 50 Q14 14 50 12 Q86 14 82 50 Q74 30 60 34 Q50 26 40 34 Q26 30 18 50Z" fill="#111"/><path d="M29 50 L45 57" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M71 50 L55 57" stroke="#111" stroke-width="5" stroke-linecap="round"/><ellipse cx="39" cy="62" rx="4.5" ry="2.6" fill="#fff"/><ellipse cx="61" cy="62" rx="4.5" ry="2.6" fill="#fff"/><rect x="35" y="73" width="30" height="11" rx="3" fill="#2a1414"/><path d="M35 78.5 L65 78.5" stroke="#fff" stroke-width="2"/>`,
  widow:`<rect width="100" height="100" fill="#121212"/><circle cx="50" cy="50" r="40" fill="none" stroke="#e62429" stroke-width="2" opacity=".5"/><path d="M33 23 L67 23 L50 50Z M33 77 L67 77 L50 50Z" fill="#e62429"/>`,

  hawkeye:`<rect width="100" height="100" fill="#3b1a5a"/><circle cx="64" cy="36" r="21" fill="none" stroke="#c4a3ff" stroke-width="3"/><circle cx="64" cy="36" r="11" fill="none" stroke="#c4a3ff" stroke-width="3"/><circle cx="64" cy="36" r="3.5" fill="#e62429"/><path d="M16 84 L58 42" stroke="#e9edf8" stroke-width="3"/><polygon points="64,36 53,41 59,47" fill="#e9edf8"/><path d="M16 84 L12 75 M16 84 L25 88 M22 78 L18 69 M22 78 L31 82" stroke="#8b5cf6" stroke-width="3"/>`,
  panther:`<rect width="100" height="100" fill="#0d0d12"/><path d="M20 20 L34 34 L66 34 L80 20 L81 60 Q66 84 50 86 Q34 84 19 60Z" fill="#1d1d26" stroke="#8b5cf6" stroke-width="1.5"/><path d="M31 48 L46 52 L44 56 L32 53Z" fill="#dfe4ff"/><path d="M69 48 L54 52 L56 56 L68 53Z" fill="#dfe4ff"/><path d="M50 38 L50 72" stroke="#2c2c38" stroke-width="2"/><path d="M26 90 L50 100 L74 90" stroke="#c7c7e0" stroke-width="3" fill="none"/><path d="M33 93 L35 99 M42 96 L43 100 M67 93 L65 99 M58 96 L57 100" stroke="#c7c7e0" stroke-width="2"/>`,

};
const HEROES = {
  fury:{n:'Nick Fury', r:'Director', join:'Welcome to the team, Agent. Don\'t make me regret this.'},

};
const ROSTER = ['fury','widow','hawkeye','spidey','panther','hulk','strange','thor','marvel','ironman','cap'];
const heroForLevel = L => ROSTER[Math.min(L, ROSTER.length)-1];

const LINES = {
  fury:['Agent {n}, your missions are on the board. Don\'t make me come down there.','I still believe in heroes. Especially ones who log their sleep.','Sugaros is watching. Show him what an Avenger looks like.','Hydrate, Agent. That\'s not a request.'],

function playStory(){
  let i = 0, typing = false, full = '';
  const ov = document.createElement('div'); ov.className = 'story'; ov.id = 'story';
  ov.innerHTML = `<div class="bars-top"></div><button class="skip" data-s="skip">Skip ⏭</button><div class="stage" id="stage"></div><div class="bars-bot"></div>`;
  document.body.appendChild(ov);
  const stage = ov.querySelector('#stage');
  const typeOut = (el, txt) => {
    clearInterval(storyTimer); full = txt; typing = true; let c = 0; el.textContent = '';
    storyTimer = setInterval(()=>{ c += 2; el.textContent = full.slice(0,c); if(c >= full.length){ clearInterval(storyTimer); typing = false; } }, 22);
  };
  const show = () => {
    const p = STORY[i];
    if(p.title){
      stage.innerHTML = `<div class="panel titlecard"><div class="tc-flash"></div><div class="tc-name">${esc(S.settings.name)}'s</div><div class="tc-logo">HERO QUEST</div><div class="tc-sub">Chapter 1 · The Recruit</div><div class="tap">tap to begin ▸</div></div>`;
      typing = false; return;
    }
    if(p.final){
      stage.innerHTML = `<div class="panel"><div class="team">${ROSTER.map(id=>av(id,46)).join('')}</div>
        <div class="who">Nick Fury</div><div class="caption speech" style="min-height:0">So, recruit — what do we call you?</div>
        <input class="field" id="codename" maxlength="24" value="${esc(S.settings.name)}" style="margin-top:14px;text-align:center;font-size:1.2rem">
        <button class="btn block" data-s="go" style="margin-top:12px;font-size:1.1rem">Avengers, assemble! ⚡</button></div>`;
      typing = false; return;
    }
    const art = p.hero ? `<div class="bigav ${p.hero==='sugaros'?'villain':''}">${av(p.hero,150)}</div><div class="who">${HEROES[p.hero].n}${p.hero==='sugaros'?' · The Snack Titan':''}</div>`
              : p.team ? `<div class="team">${p.team.map(id=>`<div>${av(id,58)}<small>${HEROES[id].n}</small></div>`).join('')}</div>` : p.art;
    stage.innerHTML = `<div class="panel">${art}<div class="caption ${p.hero?'speech':'narr'}" id="cap"></div><div class="tap">tap ▸</div></div>`;
    typeOut(stage.querySelector('#cap'), p.text.replace(/\{n\}/g, S.settings.name));
  };
  const finish = () => {
    clearInterval(storyTimer);
    const inp = ov.querySelector('#codename');
    if(inp && inp.value.trim()) S.settings.name = inp.value.trim().slice(0,24);
    S.meta.storySeen = true; save();
    ov.classList.add('out'); setTimeout(()=>ov.remove(), 450);
    render(); confetti(50); setTimeout(()=>toast('Chapter 1 begins. Good luck, Agent ⚡'), 400);
  };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if(b){ finish(); return; }
    if(e.target.closest('input')) return;
    if(STORY[i].final) return;
    if(typing){ clearInterval(storyTimer); typing = false; stage.querySelector('#cap').textContent = full; return; }
    i++; show();
  });
  show();
}

function toast(msg){

function confetti(n=26){

  for(let i=0;i<n;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.textContent = E[Math.floor(Math.random()*E.length)];
    c.style.left = Math.random()*100+'vw';
    c.style.animationDuration = (1.8+Math.random()*1.8)+'s';
    c.style.animationDelay = (Math.random()*.4)+'s';
    c.style.fontSize = (1+Math.random()*1.1)+'rem';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4200);
  }
}

  const s = stats(), xp = computeXP(s), L = levelFor(xp);
  const got = BADGES.filter(b=>b.t(s)).map(b=>b.id);
  const first = S.meta.lastXP === null;

    got.filter(id=>!S.meta.seenBadges.includes(id)).forEach(id=>{
      const b = BADGES.find(x=>x.id===id); setTimeout(()=>toast(`${b.e} Badge unlocked: <b>${b.n}</b>!`), 500);

/* ---------------- calendar ---------------- */
function calendar(month, cell, act){
  const [y,m] = month.split('-').map(Number);
  const first = new Date(y,m-1,1), days = new Date(y,m,0).getDate();
  let h = `<div class="calhead"><button data-act="${act}" data-dir="-1">‹</button><b class="fred">${MONTHS[m-1]} ${y}</b><button data-act="${act}" data-dir="1">›</button></div><div class="cal">`;
  h += ['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++) h += `<div class="d empty"></div>`;
  const t = today();
  for(let d=1; d<=days; d++){
    const k = `${y}-${pad(m)}-${pad(d)}`, c = cell(k);
    h += `<button class="d ${c.cls||''} ${k===t?'today':''} ${k>t?'future':''}" data-act="${c.act||''}" data-day="${k}">${d}${c.em?`<span class="em">${c.em}</span>`:''}</button>`;
  }
  return h + `</div>`;
}
const shiftMonth = (mo, dir) => { const [y,m] = mo.split('-').map(Number); const d = new Date(y, m-1+dir, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };

      ${days.map((k,i)=>`<div class="bar"><b>${hrs[i]?hrs[i].toFixed(1):''}</b><i class="${hrs[i]&&hrs[i]<7?'low':''}" style="height:${hrs[i]/max*100}%"></i><span>${dowShort(k)}</span></div>`).join('')}
    </div>
    <button class="btn block lav" style="margin-top:14px" data-act="sleepSheet" data-day="${t}">🔋 Log sleep</button>
    <p class="disc">Nights with ${Math.min(7,goal)}h+ count as “full recharge” and earn bonus XP ⚡</p>
  </div>
  ${recent.length?`<div class="card"><h2>📖 Recharge Log</h2>${recent.map(k=>{const x=S.sleep[k];return `
    <div class="listrow"><span style="font-size:1.3rem">${sleepHours(x)>=7?'🌙':'🌘'}</span>
      <div style="flex:1"><b class="fred">${nice(k)} · ${sleepHours(x).toFixed(1)}h</b><div class="small muted">${x.bed} → ${x.wake} · ${'⚡'.repeat(x.q)}</div></div>
      <button class="x" data-act="sleepSheet" data-day="${k}">✎</button></div>`}).join('')}</div>`:''}`;
};

VIEWS.movies = s => {
  const list = S.movies.filter(m => movieFilter==='todo' ? !m.watched : m.watched)
    .sort((a,b)=> movieFilter==='todo' ? b.addedAt-a.addedAt : b.watchedAt-a.watchedAt);
  return `
  ${mentor('spidey', pickLine('spidey', dayIdx()))}
  <div class="card">
    <h2>🎬 Movie Night Watchlist <span class="sub">${s.watched} watched</span></h2>
    <form id="movieForm" autocomplete="off">
      <input class="field" name="title" placeholder="Add a movie to watch… 🍿" maxlength="80" required>
      <div class="row" style="margin-top:8px">
        <select class="field" name="genre" style="flex:1">${GENRES.map(([e,n])=>`<option value="${e}">${e} ${n}</option>`).join('')}</select>
        <button class="btn" type="submit">Add ＋</button>
      </div>
    </form>
  </div>
  <div class="card">
    ${S.movies.some(m=>!m.watched)?`<button class="btn block lav" data-act="spin">🎲 Can't decide? Spin for tonight's mission!</button>`:''}
    <div class="seg"><button class="${movieFilter==='todo'?'on':''}" data-act="mfilter" data-v="todo">To watch (${S.movies.length-s.watched})</button><button class="${movieFilter==='done'?'on':''}" data-act="mfilter" data-v="done">Watched (${s.watched})</button></div>
    ${list.length ? list.map(m=>`
      <div class="movie">
        <div class="poster">${m.genre}</div>
        <div class="info"><b>${esc(m.title)}</b><span>${m.watched?`Watched ${nice(m.watchedAt?key(new Date(m.watchedAt)):today())} · ${m.rating?'⭐'.repeat(m.rating):'not rated'}`:`Added ${nice(key(new Date(m.addedAt)))}`}</span></div>
        ${m.watched?`<button class="btn sm soft" data-act="rate" data-id="${m.id}">⭐</button>`:`<button class="btn sm" data-act="watched" data-id="${m.id}">Watched ✓</button>`}
        <button class="x" data-act="delMovie" data-id="${m.id}">×</button>
      </div>`).join('') : `<p class="muted" style="text-align:center;font-weight:600">${movieFilter==='todo'?'Watchlist empty — add your next mission above! 🎬':'No movies watched yet. Popcorn time? 🍿'}</p>`}
  </div>`;
};

    <div class="roster">${ROSTER.map((id,i)=>`<div class="${i<L?'':'locked'}">${av(id,58,i>=L)}<b>${i<L?HEROES[id].n:'???'}</b><span>${i<L?HEROES[id].r:'Joins at Lv '+(i+1)}</span></div>`).join('')}</div>

    <h2>🏆 Hall of Heroes <span class="sub">${got}/${BADGES.length} unlocked</span></h2>

    <div class="badges">${BADGES.map(b=>`<div class="badge ${b.t(s)?'got':'locked'}"><span class="e">${b.e}</span><b>${b.n}</b><span>${b.d}</span></div>`).join('')}</div>
  </div>

      💪 Sugar-free day — <b>20 XP</b> (a treat day still gets 5 for honesty!)<br>

function render(){
  const s = stats();
  renderHeader(s); renderNav();
  document.getElementById('main').innerHTML = VIEWS[tab](s);
}

/* ---------------- sheets ---------------- */
function daySheet(k){
  const p = S.period[k] || {flow:'', symptoms:[], mood:''};
  const draft = {flow:p.flow, symptoms:[...(p.symptoms||[])], mood:p.mood||''};
  const draw = () => openSheet(`
    <h3 class="fred">🌙 ${k===today()?'Today':nice(k)}</h3>
    <label>Flow</label>
    <div>${FLOWS.map(([v,e,n])=>`<button class="chip ${draft.flow===v?'on':''}" data-d="flow" data-v="${v}">${e} ${n}</button>`).join('')}</div>
    <label>Mood</label>
    <div>${MOODS.map(m=>`<button class="chip ${draft.mood===m?'on':''}" data-d="mood" data-v="${m}" style="font-size:1.3rem;padding:6px 10px">${m}</button>`).join('')}</div>
    <label>How's your body?</label>
    <div>${SYMPTOMS.map(x=>`<button class="chip ${draft.symptoms.includes(x)?'on':''}" data-d="sym" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="row" style="margin-top:18px">
      ${S.period[k]?'<button class="btn soft" data-d="clear">Clear</button>':''}
      <button class="btn" style="flex:1" data-d="save">Save ⚡</button>
    </div>`);
  draw();
  sheet.onclick = e => {
    const b = e.target.closest('[data-d]'); if(!b) return;
    const d = b.dataset.d, v = b.dataset.v;
    if(d==='flow') draft.flow = draft.flow===v ? '' : v;
    if(d==='mood') draft.mood = draft.mood===v ? '' : v;
    if(d==='sym') draft.symptoms = draft.symptoms.includes(v) ? draft.symptoms.filter(x=>x!==v) : [...draft.symptoms, v];
    if(d==='clear'){ delete S.period[k]; sheet.onclick=null; closeSheet(); commit(); return; }
    if(d==='save'){
      if(!draft.flow && !draft.mood && !draft.symptoms.length){ toast('Pick a flow, mood or symptom first 🛡️'); return; }
      S.period[k] = {flow: draft.flow || 'none', symptoms: draft.symptoms, mood: draft.mood};
      sheet.onclick=null; closeSheet(); commit(); return;
    }
    draw();
  };
}
function sleepSheet(k){
  const x = S.sleep[k] || {bed:'23:00', wake:'07:00', q:3};
  const draft = {...x};
  const draw = () => {
    openSheet(`
    <h3 class="fred">🔋 Recharge log</h3>
    <label>Morning you woke up</label>
    <input class="field" type="date" id="sd" value="${k}" max="${today()}">
    <div class="grid2">
      <div><label>Went to bed 🛏️</label><input class="field" type="time" id="sb" value="${draft.bed}"></div>
      <div><label>Woke up ☀️</label><input class="field" type="time" id="sw" value="${draft.wake}"></div>
    </div>
    <label>Energy level</label>
    <div class="hearts">${[1,2,3,4,5].map(i=>`<button class="${i<=draft.q?'on':''}" data-d="q" data-v="${i}">⚡</button>`).join('')}</div>
    <p class="fred" id="shrs" style="text-align:center;font-size:1.2rem;color:var(--gold)"></p>
    <div class="row">${S.sleep[k]?'<button class="btn soft" data-d="del">Delete</button>':''}<button class="btn lav" style="flex:1" data-d="save">Save 🔋</button></div>`);
    const upd = () => { draft.bed = sheet.querySelector('#sb').value||draft.bed; draft.wake = sheet.querySelector('#sw').value||draft.wake;
      const h = sleepHours(draft); sheet.querySelector('#shrs').textContent = `${h.toFixed(1)} hours ${h>=8?'— fully charged! ⚡':h>=7?'— solid recharge 🔋':'— low battery, rest more 🪫'}`; };
    sheet.querySelector('#sb').oninput = upd; sheet.querySelector('#sw').oninput = upd; upd();
  };
  draw();
  sheet.onclick = e => {
    const b = e.target.closest('[data-d]'); if(!b) return;
    if(b.dataset.d==='q'){ draft.q = +b.dataset.v; sheet.querySelectorAll('.hearts button').forEach((h,i)=>h.classList.toggle('on', i<draft.q)); return; }
    if(b.dataset.d==='del'){ delete S.sleep[k]; sheet.onclick=null; closeSheet(); commit(); return; }
    if(b.dataset.d==='save'){
      const d = sheet.querySelector('#sd').value || k;
      if(d > today()){ toast('That night hasn\'t happened yet 🌙'); return; }
      draft.bed = sheet.querySelector('#sb').value || draft.bed; draft.wake = sheet.querySelector('#sw').value || draft.wake;
      if(d!==k) delete S.sleep[k];
      S.sleep[d] = {bed:draft.bed, wake:draft.wake, q:draft.q};
      sheet.onclick=null; closeSheet(); commit();
    }
  };
}
function rateSheet(id){
  const m = S.movies.find(x=>x.id===id); if(!m) return;
  let r = m.rating || 0;
  openSheet(`<h3 class="fred">⭐ Rate “${esc(m.title)}”</h3>
    <div class="hearts" style="text-align:center">${[1,2,3,4,5].map(i=>`<button class="${i<=r?'on':''}" data-d="r" data-v="${i}">⭐</button>`).join('')}</div>
    <div class="row" style="margin-top:16px"><button class="btn soft" data-d="unwatch">Move back to list</button><button class="btn" style="flex:1" data-d="save">Save</button></div>`);
  sheet.onclick = e => {
    const b = e.target.closest('[data-d]'); if(!b) return;
    if(b.dataset.d==='r'){ r = +b.dataset.v; sheet.querySelectorAll('.hearts button').forEach((h,i)=>h.classList.toggle('on', i<r)); return; }
    if(b.dataset.d==='unwatch'){ m.watched=false; m.watchedAt=null; m.rating=0; }
    if(b.dataset.d==='save'){ m.rating = r; }
    sheet.onclick=null; closeSheet(); commit();
  };
}
function spin(){
  const pool = S.movies.filter(m=>!m.watched); if(!pool.length) return;
  openSheet(`<h3 class="fred">🎲 Tonight's mission…</h3><div class="spin" id="spinbox">🍿</div><div id="spinbtns"></div>`);
  sheet.onclick = null;
  const box = sheet.querySelector('#spinbox'); let i = 0, n = 18 + Math.floor(Math.random()*pool.length);
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const tick = () => {
    if(!sheetbg.classList.contains('open')) return;
    if(i < n){ const m = pool[i%pool.length]; box.textContent = `${m.genre} ${m.title}`; i++; setTimeout(tick, 60 + i*8); }
    else {
      box.innerHTML = `<div>${pick.genre}<br>${esc(pick.title)}</div>`; confetti(30);
      sheet.querySelector('#spinbtns').innerHTML = `<div class="row" style="margin-top:14px"><button class="btn soft" data-act="spin">Spin again</button><button class="btn" style="flex:1" data-act="close">Assemble! 🍿</button></div>`;
    }
  };
  tick();
}
function settingsSheet(){
  openSheet(`<h3 class="fred">⚙️ Settings</h3>
    <label>Name</label><input class="field" id="stName" value="${esc(S.settings.name)}" maxlength="24">
    <div class="grid2">
      <div><label>Usual cycle (days)</label><input class="field" id="stCycle" type="number" min="18" max="45" value="${S.settings.cycleLen}"></div>
      <div><label>Sleep goal (hours)</label><input class="field" id="stSleep" type="number" min="5" max="12" step="0.5" value="${S.settings.sleepGoal}"></div>
    </div>
    <p class="small muted" style="font-weight:600">Cycle length is only used until 2+ periods are logged — after that it's learned from your data 🔮</p>
    <button class="btn block" data-d="save">Save</button>
    <label style="margin-top:20px">Backup 💾 <span style="font-weight:600">(data is saved only on this device)</span></label>
    <div class="row"><button class="btn soft" style="flex:1" data-d="export">Export</button><button class="btn soft" style="flex:1" data-d="import">Import</button></div>
    <button class="btn lav block" style="margin-top:14px" data-d="story">🎬 Replay story intro</button>
    <button class="btn soft block" style="margin-top:14px;color:var(--red-2)" data-d="reset">Reset everything</button>`);
  sheet.onclick = e => {
    const b = e.target.closest('[data-d]'); if(!b) return;
    const d = b.dataset.d;
    if(d==='save'){
      S.settings.name = sheet.querySelector('#stName').value.trim() || 'Ankitha';
      S.settings.cycleLen = Math.max(18, Math.min(45, +sheet.querySelector('#stCycle').value || 28));
      S.settings.sleepGoal = Math.max(5, Math.min(12, +sheet.querySelector('#stSleep').value || 8));
      sheet.onclick=null; closeSheet(); commit(); toast('Saved ⚡');
    }
    if(d==='export'){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
      a.download = `hero-quest-backup-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    }
    if(d==='import') document.getElementById('importFile').click();
    if(d==='story'){ sheet.onclick=null; closeSheet(); playStory(); }
    if(d==='reset' && confirm('Delete ALL data? This cannot be undone (no time travel here)')){
      S = structuredClone(DEFAULT); sheet.onclick=null; closeSheet(); save(); celebrate(); render();
    }
  };
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(typeof data !== 'object' || !data.settings) throw 0;
    localStorage.setItem(STORE, JSON.stringify(data)); load();
    S.meta.lastXP = null; celebrate(); closeSheet(); render(); toast('Backup restored ⚡');
  }catch(err){ toast('Hmm, that file doesn\'t look like a backup 🤔'); }
  e.target.value = '';
});

/* ---------------- events ---------------- */
const mentorTaps = {};
const PET_LINES = ['Systems online. All yours, Captain 🤖','Hydration levels low. Drink some water 💧','Proud of you today, hero 🛡️','I can do this all day 💪','Movie night soon? 🍿','Recommend early sleep tonight 🔋','Whatever it takes ⚡'];
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || !el.dataset.act) return;
  const a = el.dataset.act, k = el.dataset.day;
  switch(a){
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'close': closeSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'mentor': { const id = el.dataset.hero; mentorTaps[id] = (mentorTaps[id]||0)+1; const b = el.parentElement.querySelector('.bubble'); b.innerHTML = pickLine(id, dayIdx()+mentorTaps[id]); el.classList.remove('zap'); void el.offsetWidth; el.classList.add('zap'); break; }
    case 'pet': { const b = el.parentElement.querySelector('.bubble'); b.textContent = PET_LINES[Math.floor(Math.random()*PET_LINES.length)]; confetti(6); break; }
    case 'sugar': if(S.sugar[k]===el.dataset.v) delete S.sugar[k]; else S.sugar[k] = el.dataset.v; commit(); break;
    case 'sugarCycle': { const v = S.sugar[k]; if(!v) S.sugar[k]='free'; else if(v==='free') S.sugar[k]='slip'; else delete S.sugar[k]; commit(); break; }
    case 'sleepSheet': sleepSheet(k); break;
    case 'daySheet': daySheet(k); break;
    case 'calMonth': calMonth = shiftMonth(calMonth, +el.dataset.dir); render(); break;
    case 'sugarMonth': sugarMonth = shiftMonth(sugarMonth, +el.dataset.dir); render(); break;
    case 'mfilter': movieFilter = el.dataset.v; render(); break;
    case 'watched': { const m = S.movies.find(x=>x.id===el.dataset.id); m.watched = true; m.watchedAt = Date.now(); commit(); rateSheet(m.id); break; }
    case 'rate': rateSheet(el.dataset.id); break;
    case 'delMovie': { const m = S.movies.find(x=>x.id===el.dataset.id); if(m && confirm(`Remove “${m.title}”?`)){ S.movies = S.movies.filter(x=>x!==m); commit(); } break; }
    case 'spin': spin(); break;
  }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'movieForm') return;
  e.preventDefault();
  const f = new FormData(e.target), t = String(f.get('title')||'').trim();
  if(!t) return;
  if(S.movies.some(m=>m.title.toLowerCase()===t.toLowerCase())){ toast('Already on the list! 🎬'); return; }
  S.movies.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:t, genre:f.get('genre'), addedAt:Date.now(), watched:false, watchedAt:null, rating:0});
  movieFilter = 'todo'; commit();
  const inp = document.querySelector('#movieForm [name=title]'); if(inp) inp.focus();
});

/* ---------------- boot ---------------- */
document.getElementById('sparkles').innerHTML = Array.from({length:14},(_,i)=>
  `<span style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${.8+Math.random()*1.2}rem;animation-delay:${-Math.random()*9}s">${['⭐','⚡','✦','⭐','💫'][i%5]}</span>`).join('');
load(); celebrate(); render();
if(!S.meta.storySeen) playStory();
// re-render after midnight so "today" stays fresh
setInterval(() => { if(document.visibilityState==='visible' && !sheetbg.classList.contains('open')) render(); }, 60000);
})();
</script>
